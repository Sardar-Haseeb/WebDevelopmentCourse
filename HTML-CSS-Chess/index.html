<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Declare the character set and responsive viewport for the page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <!-- Link to the external stylesheet that defines the board appearance -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main container for the chess board app; centers content and adds page styling -->
    <div class="Chess-Main-Container">
        <!-- Heading section shown above the chess board -->
        <div class="Chess-Main-Container-Heading">
            <h2>HTML Chess</h2>
        </div>

        <!-- Chess board wrapper: holds all eight board rows -->
        <div class="Chess-Borad">
            <!-- Row 1: starts with a white square and alternates colors -->
            <div class="Chess-Borad-Rows">
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
            </div>
            <!-- Row 2: starts with a black square to continue the checkerboard pattern -->
            <div class="Chess-Borad-Rows">
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
            </div>
            <!-- Row 3: repeats the alternating pattern starting with white -->
            <div class="Chess-Borad-Rows">
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
            </div>
            <!-- Row 4: starts with black to preserve the standard chessboard layout -->
            <div class="Chess-Borad-Rows">
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
            </div>
            <!-- Row 5: starts with white for the next alternating row -->
            <div class="Chess-Borad-Rows">
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
            </div>
            <!-- Row 6: starts with black and continues the board pattern -->
            <div class="Chess-Borad-Rows">
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
            </div>
            <!-- Row 7: starts with white to keep the alternating color sequence -->
            <div class="Chess-Borad-Rows">
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
            </div>
            <!-- Row 8: final row starts with black for the completed 8x8 board -->
            <div class="Chess-Borad-Rows">
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
            </div>
        </div>
    </div>
</body>

</html>
