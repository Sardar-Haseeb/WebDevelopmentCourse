<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main container: fills the viewport and centers its content -->
    <div class="Main-Container">
        <!-- Form container: card-style wrapper for the contact form -->
        <div class="Form-Container">
            <!-- Heading for the form -->
            <h2>Contact Form</h2>
            <!-- Contact form: collects name, phone, email and a message -->
            <form>
                <!-- Form row: Name field -->
                <div class="Form-Row">
                    <label>Name</label>
                    <input type="text">
                </div>
                <!-- Form row: Phone number field -->
                <div class="Form-Row">
                    <label>Phone Number</label>
                    <input type="number">
                </div>
                <!-- Form row: Email field -->
                <div class="Form-Row">
                    <label>Email</label>
                    <input type="email">
                </div>
                <!-- Form row: Message textarea -->
                <div class="Form-Row">
                    <label>Message</label>
                    <textarea name="" id=""></textarea>
                </div>
                <!-- Form row: Submit button -->
                <div class="Form-Row">
                  <button>Submit</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
