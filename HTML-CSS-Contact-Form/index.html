<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="Main-Container">
        <div class="Form-Container">
            <h2>Contact Form</h2>
            <form>
                <div class="Form-Row">
                    <label>Name</label>
                    <input type="text">
                </div>
                <div class="Form-Row">
                    <label>Phone Number</label>
                    <input type="number">
                </div>
                <div class="Form-Row">
                    <label>Email</label>
                    <input type="email">
                </div>
                <div class="Form-Row">
                    <label>Message</label>
                    <textarea name="" id=""></textarea>
                </div>
                <div class="Form-Row">
                  <button>Submit</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
