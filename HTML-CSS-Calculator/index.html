<!-- Define HTML5 document type -->
<!DOCTYPE html>
<!-- Start HTML document with English language specification -->
<html lang="en">

<!-- Begin head section for metadata and resources -->
<head>
    <!-- Define character encoding as UTF-8 for proper text rendering -->
    <meta charset="UTF-8">
    <!-- Set viewport for responsive design and proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Set the page title that appears in browser tab -->
    <title>Calculator</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- Begin body section containing visible content -->
<body>
    <!-- Main container div for centering the calculator on the page -->
    <div class="Main-Container">
        <!-- Calculator body container with white background and shadow -->
        <div class="Calc-Body">
            <!-- Display screen section for showing calculation results -->
            <div class="Calc-Screen">
                <!-- Input field for displaying numbers and results -->
                <input type="text" name="" id="">
            </div>
            <!-- Button body container for all calculator buttons -->
            <div class="Calc-Btn-Body">
                <!-- Buttons container with flex layout -->
                <div class="Calc-Btns">
                    <!-- First row of buttons: Clear, Delete, Percent, Divide -->
                    <div class="Calc-Btns-Row">
                        <!-- Clear button to reset calculator -->
                        <button>C</button>
                        <!-- Delete button to remove last digit -->
                        <button>DEL</button>
                        <!-- Percent button for percentage calculation -->
                        <button>%</button>
                        <!-- Division operator button -->
                        <button>/</button>
                    </div>
                    <!-- Second row of buttons: 7, 8, 9, Multiply -->
                    <div class="Calc-Btns-Row">
                        <!-- Number 7 button -->
                        <button>7</button>
                        <!-- Number 8 button -->
                        <button>8</button>
                        <!-- Number 9 button -->
                        <button>9</button>
                        <!-- Multiplication operator button -->
                        <button>*</button>
                    </div>
                    <!-- Third row of buttons: 4, 5, 6, Subtract -->
                    <div class="Calc-Btns-Row">
                        <!-- Number 4 button -->
                        <button>4</button>
                        <!-- Number 5 button -->
                        <button>5</button>
                        <!-- Number 6 button -->
                        <button>6</button>
                        <!-- Subtraction operator button -->
                        <button>-</button>
                    </div>
                    <!-- Fourth row of buttons: 1, 2, 3, Add -->
                    <div class="Calc-Btns-Row">
                        <!-- Number 1 button -->
                        <button>1</button>
                        <!-- Number 2 button -->
                        <button>2</button>
                        <!-- Number 3 button -->
                        <button>3</button>
                        <!-- Addition operator button -->
                        <button>+</button>
                    </div>
                    <!-- Fifth row of buttons: Decimal, 0, 00, Equals -->
                    <div class="Calc-Btns-Row">
                        <!-- Decimal point button -->
                        <button>.</button>
                        <!-- Number 0 button -->
                        <button>0</button>
                        <!-- Number 00 button -->
                        <button>00</button>
                        <!-- Equals button to calculate result -->
                        <button>=</button>
                    </div>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
